spring.application.name=Ejercicio5MyAPIGestor
server.port=8081
# Valores por defecto para trabajar en local; en Docker/Jenkins se sobreescriben con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dbgestor}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
